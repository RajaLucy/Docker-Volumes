    - name: Gemini AI Decision Engine
      shell: bash
      run: |

        python3 <<EOF

        import os
        import json
        import requests
        import re

        with open("ai/prompts/decision.md") as f:
            system_prompt = f.read()

        with open("ai/schemas/decision-schema.json") as f:
            schema = f.read()

        with open("changed_files.txt") as f:
            files = f.read()

        with open("ai_analysis.patch") as f:
            patch = f.read()


        final_prompt = f"""
        {system_prompt}

        ========================================

        Expected JSON Schema

        {schema}

        ========================================

        Source Branch

        main

        Target Branch

        release/v1.0

        ========================================

        Changed Files

        {files}

        ========================================

        Git Patch

        {patch}
        """

        response = requests.post(

            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",

            params={
                "key": os.environ["GEMINI_API_KEY"]
            },

            headers={
                "Content-Type":"application/json"
            },

            json={
                "contents":[
                    {
                        "parts":[
                            {
                                "text": final_prompt
                            }
                        ]
                    }
                ]
            }
        )

        print("========== RAW AI RESPONSE ==========")
        print(response.text)
        print("=====================================")

        data = response.json()
        if "candidates" not in data:
            print("Gemini request failed")
            print(json.dumps(data, indent=2))
            exit(1)

        text = data["candidates"][0]["content"]["parts"][0]["text"]

        match = re.search(r'```json(.*?)```', text, re.S)

        if match:
            json_text = match.group(1).strip()
        else:
            json_text = text.strip()

        decision = json.loads(json_text)
        try:
          decision = json.loads(json_text)
        except Exception as e:
          print("Failed to parse AI JSON")
          print(json_text)
          raise e

        print()
        print("====================================")
        print("AI RELEASE DECISION")
        print("====================================")
        print("Decision       :", decision.get("decision"))
        print("Confidence     :", decision.get("confidence"))
        print("Safe To Apply  :", decision.get("safe_to_apply"))
        print("Conflicts      :", decision.get("conflicts"))
        print("Summary        :", decision.get("summary"))
        print("Warnings       :", decision.get("warnings"))
        print("====================================")

        with open("ai-decision.json","w") as f:
            json.dump(decision,f,indent=2)

        if decision.get("decision") == "STOP":
            print("AI requested workflow stop.")
            exit(1)

        if decision.get("decision") == "MANUAL_REVIEW":
            print("AI requested manual review.")
            exit(1)

        print("AI approved workflow.")

        EOF




    - name: Apply merge commit changes excluding github files
      shell: bash
      run: |


        FILES=$(cat changed_files.txt)



        for FILE in $FILES

        do

          if [[ "$FILE" == .github/* ]]

          then

             echo "Ignoring:"
             echo "$FILE"


          else

             echo "Applying:"
             echo "$FILE"

             git checkout "$MERGE_SHA" -- "$FILE"

          fi


        done




    - name: Remove temporary files
      run: |

        rm -f ai_analysis.patch

        rm -f changed_files.txt




    - name: Commit changes
      run: |


        git add -u


        git commit \
        -m "Sync changes from main merge $MERGE_SHA" \
        || echo "No changes"



    - name: Push feature branch
      run: |


        git push origin "$FEATURE_BRANCH"