name : This is AI workflow

on:
  pull_request:
    types:
      - closed
    branches:
      - main


jobs:
  check-release-version:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name : Set environment variable
        run: |
          echo "MERGE_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=release/v1.0" >> $GITHUB_ENV
          echo "FEATURE_BRANCH=feature/release-v1.0" >> $GITHUB_ENV

      - name : Fetch all branches
        run: |
          git fetch origin


      - name: Check release branch
        run: |

          echo "Checking release branch: $RELEASE_BRANCH"

          if git ls-remote --heads origin $RELEASE_BRANCH | grep $RELEASE_BRANCH
          then
            echo "Release branch exists"
          else
            echo "ERROR: Release branch does not exist"
            exit 1
          fi

      - name: Create release feature branch
        run: |

          echo "Creating branch: $FEATURE_BRANCH"

          git checkout -b $FEATURE_BRANCH origin/$RELEASE_BRANCH

          echo "Current branch:"
          git branch

      - name: Apply main changes excluding .github
        run: |

          echo "Merge commit:"
          echo $MERGE_SHA


          echo "Finding changed files..."

          FILES=$(git diff-tree \
          --no-commit-id \
          --name-only \
          -r \
          $MERGE_SHA)


          echo "Changed files:"
          echo "$FILES"


          for FILE in $FILES
          do

            if [[ "$FILE" == .github/* ]]
            then
              echo "Ignoring:"
              echo $FILE

            else

              echo "Applying:"
              echo $FILE

              git checkout $MERGE_SHA -- $FILE

            fi

          done



      - name: Commit changes
        run: |

          git status

          git add .

          git commit -m "Sync changes from main merge $MERGE_SHA" || echo "No changes to commit"



      - name: Push release feature branch
        run: |

          git push origin $FEATURE_BRANCH

