name: Intelligent Cherry Pick With AI Conflict Resolution

on:
pull_request:
types:
- closed
branches:
- main

permissions:
contents: write
pull-requests: write

jobs:
cherry-pick-release:

```
if: github.event.pull_request.merged == true

runs-on: ubuntu-latest

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # TEMPORARY:
  # Later this can be extracted from the PR body.
  SYNC_MODE: AUTO

  RELEASE_BRANCH: release/v1.0
  FEATURE_BRANCH: feature/release-v1.0

  GEMINI_MODEL: gemini-2.5-flash

steps:

  # ============================================================
  # CHECKOUT
  # ============================================================

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      token: ${{ github.token }}

  # ============================================================
  # CONFIGURATION
  # ============================================================

  - name: Configure synchronization
    shell: bash
    run: |

      set -euo pipefail

      MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

      if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
        echo "ERROR: Merge commit SHA is missing"
        exit 1
      fi

      echo "MERGE_SHA=$MERGE_SHA" >> "$GITHUB_ENV"

      echo "======================================"
      echo "Synchronization configuration"
      echo "======================================"

      echo "Mode           : $SYNC_MODE"
      echo "Source merge   : $MERGE_SHA"
      echo "Feature branch : $FEATURE_BRANCH"
      echo "Release branch : $RELEASE_BRANCH"

  # ============================================================
  # FETCH
  # ============================================================

  - name: Fetch branches
    shell: bash
    run: |

      set -euo pipefail

      git fetch origin --prune --tags

      git fetch origin \
        "$RELEASE_BRANCH:$RELEASE_BRANCH" \
        "$FEATURE_BRANCH:$FEATURE_BRANCH" \
        || true

      git fetch origin "$MERGE_SHA"

  # ============================================================
  # VERIFY RELEASE BRANCH
  # ============================================================

  - name: Verify release branch
    shell: bash
    run: |

      set -euo pipefail

      if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1
      then
        echo "Release branch exists: $RELEASE_BRANCH"
      else
        echo "ERROR: Release branch does not exist"
        exit 1
      fi

  # ============================================================
  # CREATE / CHECKOUT FEATURE BRANCH
  # ============================================================

  - name: Create or checkout synchronization branch
    shell: bash
    run: |

      set -euo pipefail

      if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" >/dev/null 2>&1
      then

        echo "Feature branch exists"

        git checkout "$FEATURE_BRANCH"
        git pull --ff-only origin "$FEATURE_BRANCH"

      else

        echo "Feature branch does not exist"

        git checkout -b "$FEATURE_BRANCH" "origin/$RELEASE_BRANCH"

      fi

      git branch --show-current

  # ============================================================
  # GIT IDENTITY
  # ============================================================

  - name: Configure git identity
    run: |

      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

  # ============================================================
  # SHOW SOURCE INFORMATION
  # ============================================================

  - name: Analyze source merge information
    shell: bash
    run: |

      set -euo pipefail

      echo "======================================"
      echo "SOURCE MERGE"
      echo "======================================"

      git show --no-ext-diff --stat "$MERGE_SHA"

      echo ""
      echo "Parents:"

      git show -s \
        --format='%P' \
        "$MERGE_SHA"

      echo ""
      echo "Commit message:"

      git show -s \
        --format='%s' \
        "$MERGE_SHA"

  # ============================================================
  # ATTEMPT REAL GIT MERGE
  # ============================================================

  - name: Attempt synchronization merge
    id: merge
    shell: bash
    run: |

      set -euo pipefail

      echo "======================================"
      echo "Attempting real Git merge"
      echo "======================================"

      git merge \
        --no-commit \
        --no-ff \
        "$MERGE_SHA" \
        || true

      CONFLICT_FILES=$(git diff \
        --name-only \
        --diff-filter=U)

      if [ -n "$CONFLICT_FILES" ]; then

        echo "Git conflicts detected"

        echo "$CONFLICT_FILES"

        echo "HAS_CONFLICTS=true" >> "$GITHUB_ENV"

      else

        echo "No Git conflicts detected"

        echo "HAS_CONFLICTS=false" >> "$GITHUB_ENV"

      fi

  # ============================================================
  # COLLECT GIT CONTEXT FOR AI
  # ============================================================

  - name: Collect conflict context
    if: env.HAS_CONFLICTS == 'true'
    shell: bash
    run: |

      set -euo pipefail

      mkdir -p ai/context

      echo "======================================"
      echo "Collecting Git conflict context"
      echo "======================================"

      TARGET_SHA=$(git rev-parse HEAD)

      SOURCE_SHA="$MERGE_SHA"

      MERGE_BASE=$(git merge-base "$TARGET_SHA" "$SOURCE_SHA" || true)

      echo "$TARGET_SHA" > ai/context/target.sha
      echo "$SOURCE_SHA" > ai/context/source.sha
      echo "$MERGE_BASE" > ai/context/merge-base.sha

      git diff \
        --name-status \
        "$TARGET_SHA" \
        "$SOURCE_SHA" \
        > ai/context/changed-files.txt

      git diff \
        --no-ext-diff \
        "$TARGET_SHA" \
        "$SOURCE_SHA" \
        > ai/context/source-target.diff

      git diff \
        --no-ext-diff \
        --merge \
        > ai/context/conflicts.diff || true

      : > ai/context/files.jsonl

      while IFS= read -r FILE
      do

        [ -z "$FILE" ] && continue

        echo ""
        echo "Processing:"
        echo "$FILE"

        SAFE_NAME=$(printf '%s' "$FILE" | base64 -w 0)

        {
          echo "{"
          printf '"file":"%s",' "$(printf '%s' "$FILE" | sed 's/\\/\\\\/g; s/"/\\"/g')"

          if git cat-file -e ":1:$FILE" 2>/dev/null
          then
            BASE=$(git show ":1:$FILE")
          else
            BASE=""
          fi

          if git cat-file -e ":2:$FILE" 2>/dev/null
          then
            TARGET=$(git show ":2:$FILE")
          else
            TARGET=""
          fi

          if git cat-file -e ":3:$FILE" 2>/dev/null
          then
            SOURCE=$(git show ":3:$FILE")
          else
            SOURCE=""
          fi

          printf '"base":"%s",' \
            "$(printf '%s' "$BASE" | base64 -w 0)"

          printf '"target":"%s",' \
            "$(printf '%s' "$TARGET" | base64 -w 0)"

          printf '"source":"%s"' \
            "$(printf '%s' "$SOURCE" | base64 -w 0)"

          echo "}"

        } >> ai/context/files.jsonl

      done < <(
        git diff \
          --name-only \
          --diff-filter=U
      )

      echo ""
      echo "Conflict context collected"

  # ============================================================
  # NO-CONFLICT PATH
  # ============================================================

  - name: Finalize non-conflicting merge
    if: env.HAS_CONFLICTS == 'false'
    shell: bash
    run: |

      set -euo pipefail

      echo "======================================"
      echo "No conflicts"
      echo "======================================"

      git status

      if git diff --cached --quiet
      then

        echo "Nothing staged"

      else

        git commit \
          -m "Sync changes from main merge $MERGE_SHA"

      fi

  # ============================================================
  # PREPARE AI PROMPT
  # ============================================================

  - name: Prepare AI analysis
    if: env.HAS_CONFLICTS == 'true'
    shell: bash
    run: |

      set -euo pipefail

      cp ai/prompts/decision.md ai/runtime-prompt.md
      cp ai/schemas/decision-schema.json ai/runtime-schema.json

      python3 <<'PY'

      import json
      import os
      import base64
      from pathlib import Path

      def decode(value):
          if not value:
              return ""
          return base64.b64decode(value).decode("utf-8", errors="replace")

      context = []

      path = Path("ai/context/files.jsonl")

      for line in path.read_text().splitlines():

          if not line.strip():
              continue

          item = json.loads(line)

          context.append({
              "file": item["file"],
              "base_content": decode(item["base"]),
              "target_content": decode(item["target"]),
              "source_content": decode(item["source"])
          })

      payload = {
          "mode": os.environ["SYNC_MODE"],
          "target_branch": os.environ["RELEASE_BRANCH"],
          "source_branch": os.environ["FEATURE_BRANCH"],
          "merge_commit": os.environ["MERGE_SHA"],
          "merge_base": Path(
              "ai/context/merge-base.sha"
          ).read_text().strip(),
          "conflicted_files": context,
          "changed_files": Path(
              "ai/context/changed-files.txt"
          ).read_text(),
          "source_target_diff": Path(
              "ai/context/source-target.diff"
          ).read_text(),
          "conflict_diff": Path(
              "ai/context/conflicts.diff"
          ).read_text()
      }

      Path("ai/context/request.json").write_text(
          json.dumps(payload, indent=2)
      )

      PY

  # ============================================================
  # GEMINI
  # ============================================================

  - name: Gemini conflict resolution engine
    if: env.HAS_CONFLICTS == 'true'
    shell: bash
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |

      set -euo pipefail

      if [ -z "${GEMINI_API_KEY:-}" ]; then
        echo "ERROR: GEMINI_API_KEY is not configured"
        exit 1
      fi

      python3 <<'PY'

      import json
      import os
      import requests
      from pathlib import Path

      api_key = os.environ["GEMINI_API_KEY"]
      model = os.environ["GEMINI_MODEL"]

      prompt = Path(
          "ai/runtime-prompt.md"
      ).read_text()

      schema = json.loads(
          Path("ai/runtime-schema.json").read_text()
      )

      request_context = json.loads(
          Path("ai/context/request.json").read_text()
      )

      full_prompt = f"""
      {prompt}

      ============================================================
      CURRENT GIT SYNCHRONIZATION REQUEST
      ============================================================

      {json.dumps(request_context, indent=2)}

      ============================================================
      IMPORTANT
      ============================================================

      The workflow has already attempted the real Git merge.

      The TARGET side is the current release/synchronization branch.

      The SOURCE side is the incoming merge commit.

      The BASE side is the common merge base.

      In AUTO mode, resolved_content MUST contain the COMPLETE
      final content of every conflicted file.

      Do not return partial content.

      Do not return Markdown.

      Do not return conflict markers.

      Follow the JSON schema exactly.
      """

      url = (
          f"https://generativelanguage.googleapis.com/v1beta/"
          f"models/{model}:generateContent"
      )

      body = {
          "contents": [
              {
                  "parts": [
                      {
                          "text": full_prompt
                      }
                  ]
              }
          ],
          "generationConfig": {
              "responseMimeType": "application/json",
              "responseSchema": schema,
              "temperature": 0.1
          }
      }

      response = requests.post(
          url,
          params={"key": api_key},
          headers={
              "Content-Type": "application/json"
          },
          json=body,
          timeout=300
      )

      print("Gemini HTTP status:", response.status_code)

      if not response.ok:
          print(response.text)
          raise SystemExit(
              "Gemini API request failed"
          )

      data = response.json()

      try:
          text = (
              data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
          )
      except Exception:
          print(json.dumps(data, indent=2))
          raise SystemExit(
              "Gemini response did not contain expected content"
          )

      result = json.loads(text)

      Path("ai-decision.json").write_text(
          json.dumps(result, indent=2)
      )

      print("")
      print("======================================")
      print("AI DECISION")
      print("======================================")

      print("Mode       :", result.get("mode"))
      print("Decision   :", result.get("decision"))
      print("Confidence :", result.get("confidence"))
      print("Safe Apply :", result.get("safe_to_apply"))
      print("Summary    :", result.get("summary"))

      print("")
      print("Warnings:")

      for warning in result.get("warnings", []):
          print("-", warning)

      print("")
      print("======================================")

      PY

  # ============================================================
  # PRE-APPLY VALIDATION
  # ============================================================

  - name: Validate AI decision
    if: env.HAS_CONFLICTS == 'true'
    shell: bash
    run: |

      set -euo pipefail

      python3 <<'PY'

      import json
      from pathlib import Path

      result = json.loads(
          Path("ai-decision.json").read_text()
      )

      mode = result["mode"]
      decision = result["decision"]
      safe = result["safe_to_apply"]
      confidence = result["confidence"]

      print("======================================")
      print("AI VALIDATION")
      print("======================================")

      print("Mode:", mode)
      print("Decision:", decision)
      print("Safe:", safe)
      print("Confidence:", confidence)

      if mode not in ("AUTO", "MANUAL"):
          raise SystemExit(
              "Invalid AI mode"
          )

      if mode != __import__("os").environ["SYNC_MODE"]:
          raise SystemExit(
              "AI mode does not match workflow mode"
          )

      if mode == "MANUAL":

          print("")
          print("MANUAL REVIEW REQUIRED")
          print("")

          print(
              result.get(
                  "recommendation",
                  ""
              )
          )

          for resolution in result.get(
              "resolutions",
              []
          ):

              print("")
              print(
                  "FILE:",
                  resolution["file"]
              )

              print(
                  "STRATEGY:",
                  resolution[
                      "resolution_strategy"
                  ]
              )

              print(
                  "REASON:",
                  resolution["reason"]
              )

              print("MANUAL STEPS:")

              for step in resolution[
                  "manual_steps"
              ]:
                  print("-", step)

          raise SystemExit(
              "Workflow stopped for MANUAL review"
          )

      if decision != "RESOLVE":
          raise SystemExit(
              f"AI decision is {decision}; "
              "automatic resolution is not permitted"
          )

      if safe is not True:
          raise SystemExit(
              "AI did not mark resolution safe"
          )

      if confidence < 80:
          raise SystemExit(
              "AI confidence is below AUTO threshold"
          )

      resolutions = result.get(
          "resolutions",
          []
      )

      if not resolutions:
          raise SystemExit(
              "AI returned no conflict resolutions"
          )

      for item in resolutions:

          if not item["safe_to_apply"]:
              raise SystemExit(
                  "At least one resolution is unsafe"
              )

          content = item["resolved_content"]

          if (
              "<<<<<<<" in content
              or "=======" in content
              or ">>>>>>>" in content
          ):
              raise SystemExit(
                  "AI returned unresolved conflict markers"
              )

      print("")
      print("AI resolution passed pre-apply validation")

      PY

  # ============================================================
  # PRINT PRE-APPLY LOG
  # ============================================================

  - name: Print AI pre-apply resolution log
    if: env.HAS_CONFLICTS == 'true' && env.SYNC_MODE == 'AUTO'
    shell: bash
    run: |

      set -euo pipefail

      echo "=============================================="
      echo "AI PRE-APPLY RESOLUTION LOG"
      echo "=============================================="

      jq '
        {
          mode,
          decision,
          confidence,
          safe_to_apply,
          summary,
          warnings,
          analysis,
          resolutions: [
            .resolutions[] |
            {
              file,
              conflict_id,
              affected_lines,
              affected_functions,
              target_code_analysis,
              source_code_analysis,
              merge_base_analysis,
              conflict_analysis,
              resolution_strategy,
              reason,
              confidence,
              safe_to_apply,
              validation,
              warnings
            }
          ],
          recommendation
        }
      ' ai-decision.json

      echo "=============================================="

  # ============================================================
  # APPLY AI RESOLUTIONS
  # ============================================================

  - name: Apply AI conflict resolutions
    if: env.HAS_CONFLICTS == 'true' && env.SYNC_MODE == 'AUTO'
    shell: bash
    run: |

      set -euo pipefail

      python3 <<'PY'

      import json
      from pathlib import Path

      result = json.loads(
          Path("ai-decision.json").read_text()
      )

      for resolution in result["resolutions"]:

          file = Path(
              resolution["file"]
          )

          strategy = resolution[
              "resolution_strategy"
          ]

          content = resolution[
              "resolved_content"
          ]

          print("")
          print("Applying:", file)
          print("Strategy:", strategy)

          if strategy == "DELETE_FILE":

              if file.exists():
                  file.unlink()

              continue

          file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          file.write_text(
              content,
              encoding="utf-8",
              newline=""
          )

      PY

      echo ""
      echo "AI resolutions applied"

      git status --short

  # ============================================================
  # VERIFY NO CONFLICTS REMAIN
  # ============================================================

  - name: Verify conflict resolution
    if: env.HAS_CONFLICTS == 'true' && env.SYNC_MODE == 'AUTO'
    shell: bash
    run: |

      set -euo pipefail

      echo "Checking unresolved Git conflicts"

      if git diff \
        --name-only \
        --diff-filter=U |
        grep -q .
      then

        echo "ERROR: Git conflicts still exist"

        git diff \
          --name-only \
          --diff-filter=U

        exit 1

      fi

      echo "No unresolved Git conflicts"

      if git grep -n \
        -E '^(<<<<<<<|=======|>>>>>>>)' \
        -- . ':!ai/*' ':!.git/*'
      then

        echo "ERROR: Conflict markers remain"

        exit 1

      fi

      echo "No conflict markers remain"

  # ============================================================
  # STAGE MERGE
  # ============================================================

  - name: Stage synchronized changes
    shell: bash
    run: |

      set -euo pipefail

      git add -A

      echo "======================================"
      echo "Staged changes"
      echo "======================================"

      git status --short

      git diff \
        --cached \
        --stat

  # ============================================================
  # VALIDATE MERGE
  # ============================================================

  - name: Validate final synchronization
    shell: bash
    run: |

      set -euo pipefail

      echo "======================================"
      echo "Final synchronization validation"
      echo "======================================"

      if git diff \
        --cached \
        --check
      then

        echo "Whitespace validation passed"

      else

        echo "ERROR: git diff --check failed"
        exit 1

      fi

      if git diff \
        --cached |
        grep -q \
          -E '^(<<<<<<<|=======|>>>>>>>)'
      then

        echo "ERROR: Conflict markers found in staged diff"
        exit 1

      fi

      echo "Conflict-marker validation passed"

  # ============================================================
  # COMMIT
  # ============================================================

  - name: Commit synchronized changes
    shell: bash
    run: |

      set -euo pipefail

      if git diff \
        --cached \
        --quiet
      then

        echo "No changes to commit"

      else

        git commit \
          -m "Sync changes from main merge $MERGE_SHA"

      fi

  # ============================================================
  # ABORT MERGE STATE IF NECESSARY
  # ============================================================

  - name: Finalize merge state
    shell: bash
    run: |

      set -euo pipefail

      if [ -f .git/MERGE_HEAD ]; then

        echo "Completing merge commit"

        git commit \
          --no-edit \
          || true

      fi

  # ============================================================
  # PUSH FEATURE BRANCH
  # ============================================================

  - name: Push synchronization branch
    shell: bash
    run: |

      set -euo pipefail

      echo "Pushing:"
      echo "$FEATURE_BRANCH"

      git push \
        origin \
        "$FEATURE_BRANCH"

  # ============================================================
  # GITHUB CLI
  # ============================================================

  - name: Verify GitHub CLI
    env:
      GH_TOKEN: ${{ github.token }}
    run: |

      gh auth status

  # ============================================================
  # CREATE OR UPDATE PR
  # ============================================================

  - name: Create or update Pull Request
    env:
      GH_TOKEN: ${{ github.token }}
    shell: bash
    run: |

      set -euo pipefail

      EXISTING_PR=$(gh pr list \
        --repo "$GITHUB_REPOSITORY" \
        --head "$FEATURE_BRANCH" \
        --base "$RELEASE_BRANCH" \
        --state open \
        --json number,url \
        --jq '.[0]')

      if [ -n "$EXISTING_PR" ]; then

        PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
        PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')

        echo "Existing PR found"
        echo "$PR_URL"

        gh pr edit "$PR_NUMBER" \
          --title \
            "Automated sync from main - $MERGE_SHA" \
          --body "$(cat <<EOF
      ## Automated Release Sync

      ### Source
      main

      ### Target
      $RELEASE_BRANCH

      ### Feature / Sync Branch
      $FEATURE_BRANCH

      ### Merge Commit
      $MERGE_SHA

      ### AI Mode
      $SYNC_MODE

      ### AI Decision
      $(jq -r '.decision' ai-decision.json 2>/dev/null || echo "NO_CONFLICT")

      ### AI Confidence
      $(jq -r '.confidence' ai-decision.json 2>/dev/null || echo "N/A")

      The synchronization branch was generated by the Intelligent
      Cherry Pick / Conflict Resolution workflow.
      EOF
      )"

      else

        echo "Creating Pull Request"

        gh pr create \
          --repo "$GITHUB_REPOSITORY" \
          --base "$RELEASE_BRANCH" \
          --head "$FEATURE_BRANCH" \
          --title \
            "Automated sync from main - $MERGE_SHA" \
          --body "$(cat <<EOF
      ## Automated Release Sync

      ### Source
      main

      ### Target
      $RELEASE_BRANCH

      ### Feature / Sync Branch
      $FEATURE_BRANCH

      ### Merge Commit
      $MERGE_SHA

      ### AI Mode
      $SYNC_MODE

      Generated automatically by the Intelligent
      Cherry Pick / Conflict Resolution workflow.
      EOF
      )"

      fi
