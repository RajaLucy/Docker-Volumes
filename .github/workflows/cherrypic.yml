name: Intelligent Cherry Pick Phase 2


on:
  pull_request:
    types:
      - closed
    branches:
      - main


# Allow workflow to push branches
permissions:
  contents: write


jobs:

  cherry-pick-release:

    # Run only after PR merge
    if: github.event.pull_request.merged == true


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Configure variables
        run: |

          echo "MERGE_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_ENV

          echo "RELEASE_BRANCH=release/v1.0" >> $GITHUB_ENV

          echo "FEATURE_BRANCH=feature/release-v1.0" >> $GITHUB_ENV



      - name: Fetch all branches
        run: |

          git fetch origin --prune



      - name: Check release branch exists
        run: |

          echo "Checking release branch:"
          echo "$RELEASE_BRANCH"


          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep "$RELEASE_BRANCH"
          then
              echo "Release branch exists"
          else
              echo "ERROR: Release branch does not exist"
              exit 1
          fi



      - name: Create feature branch from release
        run: |

          echo "Creating branch:"
          echo "$FEATURE_BRANCH"


          git checkout -b "$FEATURE_BRANCH" "origin/$RELEASE_BRANCH"


          echo "Current branch:"
          git branch



      - name: Configure git identity
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"



      - name: Apply changes from main excluding .github
        shell: bash
        run: |


          echo "Merge commit:"
          echo "$MERGE_SHA"


          echo "Finding changed files..."


          FILES=$(git diff-tree \
          --no-commit-id \
          --name-only \
          -r \
          -m \
          "$MERGE_SHA")


          echo "Changed files:"
          echo "$FILES"



          if [ -z "$FILES" ]
          then
              echo "No changed files detected"
              exit 0
          fi



          for FILE in $FILES
          do

              if [[ "$FILE" == .github/* ]]
              then

                  echo "Ignoring workflow file:"
                  echo "$FILE"


              else

                  echo "Applying file:"
                  echo "$FILE"


                  git checkout "$MERGE_SHA" -- "$FILE"

              fi

          done



      - name: Check changes
        run: |

          git status



      - name: Commit changes
        run: |


          git add .


          git commit \
          -m "Sync changes from main merge $MERGE_SHA" \
          || echo "No changes to commit"



      - name: Push release feature branch
        run: |


          echo "Pushing branch:"
          echo "$FEATURE_BRANCH"


          git push origin "$FEATURE_BRANCH"