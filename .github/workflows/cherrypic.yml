name: Intelligent Cherry Pick With AI Analysis


on:

  pull_request:

    types:
      - closed

    branches:
      - main



permissions:

  contents: write
  pull-requests: write



jobs:


  cherry-pick-release:


    if: github.event.pull_request.merged == true


    runs-on: ubuntu-latest


    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}



    steps:



    - name: Checkout repository

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Configure variables

      run: |

        echo "MERGE_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_ENV

        echo "RELEASE_BRANCH=release/v1.0" >> $GITHUB_ENV

        echo "FEATURE_BRANCH=feature/release-v1.0" >> $GITHUB_ENV



    - name: Fetch branches

      run: |

        git fetch origin --prune



    - name: Check release branch exists

      shell: bash

      run: |


        echo "Checking release branch"

        echo "$RELEASE_BRANCH"



        if git ls-remote --heads origin "$RELEASE_BRANCH" | grep "$RELEASE_BRANCH"

        then

          echo "Release branch exists"

        else

          echo "ERROR: Release branch does not exist"

          exit 1

        fi




    - name: Create or checkout feature branch

      shell: bash

      run: |


        echo "Checking feature branch"


        if git ls-remote --heads origin "$FEATURE_BRANCH" | grep "$FEATURE_BRANCH"

        then


          echo "Feature branch exists"


          git checkout "$FEATURE_BRANCH"

          git pull origin "$FEATURE_BRANCH"



        else


          echo "Creating feature branch"


          git checkout -b "$FEATURE_BRANCH" "origin/$RELEASE_BRANCH"



        fi



        git branch




    - name: Configure git identity

      run: |


        git config user.name "github-actions"

        git config user.email "github-actions@github.com"





    - name: Extract changed files

      shell: bash

      run: |


        echo "Merge commit"

        echo "$MERGE_SHA"



        FILES=$(git diff-tree \
        --no-commit-id \
        --name-only \
        -r \
        -m \
        "$MERGE_SHA")



        echo "$FILES"



        echo "$FILES" > changed_files.txt






    - name: Prepare AI analysis

      shell: bash

      run: |


        echo "Preparing AI input"



        git diff \
        origin/$RELEASE_BRANCH \
        $MERGE_SHA \
        -- \
        ':!.github/*' \
        ':!ai/*' \
        > ai_analysis.patch




        echo "Loading AI prompt from merge commit"



        if git show "$MERGE_SHA:ai/prompts/decision.md" > ai_prompt.md
        then
          echo "Prompt loaded from merge commit"
        else
          echo "Prompt missing"
          exit 1
        
        fi




        echo "Loading AI schema from merge commit"



        git show "$MERGE_SHA:ai/schemas/decision-schema.json" > ai_schema.json





        echo "============================"

        echo "Changed files"

        cat changed_files.txt



        echo "============================"

        echo "AI Prompt"

        cat ai_prompt.md



        echo "============================"

        echo "AI Schema"

        cat ai_schema.json



        echo "============================"

        echo "Diff"

        cat ai_analysis.patch





    - name: Gemini AI Decision Engine

      shell: bash

      run: |


        python3 <<'EOF'


        import os
        import json
        import requests
        import re




        with open("ai_prompt.md") as f:

            prompt_file=f.read()



        with open("ai_schema.json") as f:

            schema=f.read()



        with open("changed_files.txt") as f:

            files=f.read()



        with open("ai_analysis.patch") as f:

            diff=f.read()





        prompt=f"""


        {prompt_file}



        Expected JSON:

        {schema}



        Source Branch:

        main



        Target Branch:

        {os.environ['RELEASE_BRANCH']}



        Changed Files:

        {files}



        Git Diff:

        {diff}



        Return JSON only.

        """





        response=requests.post(


        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",


        params={

            "key":os.environ["GEMINI_API_KEY"]

        },


        headers={

            "Content-Type":"application/json"

        },


        json={


            "contents":[

                {

                    "parts":[

                        {

                            "text":prompt

                        }

                    ]

                }

            ]

        }


        )




        print("========== RAW GEMINI RESPONSE ==========")

        print(response.text)

        print("=========================================")





        data=response.json()



        if "candidates" not in data:

            raise Exception(data)



        text=data["candidates"][0]["content"]["parts"][0]["text"]





        json_text = text.strip()

        if "```json" in json_text:
            json_text = json_text.replace("```json", "")
            json_text = json_text.replace("```", "")

        json_text = json_text.strip()





        try:


            decision=json.loads(json_text)



        except Exception:


            print("Invalid JSON from AI")

            print(json_text)

            raise





        print()

        print("========== AI DECISION ==========")


        print("Decision      :", decision.get("decision"))

        print("Confidence    :", decision.get("confidence"))

        print("Safe Apply    :", decision.get("safe_to_apply"))

        print("Conflicts     :", decision.get("conflicts"))


        print()

        print("Summary:")

        print(decision.get("summary"))


        print()

        print("Warnings:")


        for warning in decision.get("warnings", []):

            print("-",warning)



        print()

        print("Recommendation:")

        print(decision.get("recommendation"))


        print("================================")




        with open("ai-decision.json","w") as f:

            json.dump(decision,f,indent=2)




        if decision.get("decision") == "STOP":

            print("AI stopped workflow")

            exit(1)



        if decision.get("decision") == "MANUAL_REVIEW":

            print("AI requires manual review")

            exit(1)




        print("AI approved synchronization")



        EOF



    - name: Validate AI Decision
      shell: bash
      run: |

        echo "Checking AI decision"


        DECISION=$(jq -r '.decision' ai-decision.json)

        SAFE=$(jq -r '.safe_to_apply' ai-decision.json)

        CONFLICT=$(jq -r '.conflicts' ai-decision.json)


        echo "Decision: $DECISION"
        echo "Safe: $SAFE"
        echo "Conflicts: $CONFLICT"



        if [ "$DECISION" != "CONTINUE" ]
        then
            echo "AI rejected synchronization"
            exit 1
        fi


        if [ "$SAFE" != "true" ]
        then
            echo "Unsafe changes"
            exit 1
        fi


        if [ "$CONFLICT" = "true" ]
        then
            echo "Conflict detected"
            exit 1
        fi


        echo "AI approved synchronization"
    


    - name: Apply merge changes excluding system files
      shell: bash
      run: |

        FILES=$(cat changed_files.txt)

        for FILE in $FILES
        do

          if [[ "$FILE" == .github/* ]] || [[ "$FILE" == ai/* ]]
          then

            echo "Ignoring:"
            echo "$FILE"

          else

            echo "Applying:"
            echo "$FILE"

            git checkout "$MERGE_SHA" -- "$FILE"

          fi

        done





    - name: Cleanup temporary files

      run: |


        rm -f ai_analysis.patch

        rm -f changed_files.txt

        rm -f ai_prompt.md

        rm -f ai_schema.json






    - name: Commit changes
      shell: bash
      run: |

        echo "Preparing commit"

        git status

        git add -u


        if git diff --cached --quiet
        then
            echo "No changes to commit"
        else

            git commit -m "Sync changes from main merge $MERGE_SHA"

        fi



    - name: Push feature branch
      shell: bash
      run: |

        echo "Pushing feature branch"

        echo "Branch:"
        echo "$FEATURE_BRANCH"


        git push origin "$FEATURE_BRANCH"


    - name: Create Pull Request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}

      run: |

        echo "Creating Pull Request"


        gh pr create \
          --base "$RELEASE_BRANCH" \
          --head "$FEATURE_BRANCH" \
          --title "Automated sync from main - $MERGE_SHA" \
          --body "
        ## Automated Release Sync

        ### Source Branch
        main

        ### Target Branch
        $RELEASE_BRANCH

        ### Merge Commit
        $MERGE_SHA


        ## AI Decision

        $(cat ai-decision.json)


        Generated automatically by Intelligent Cherry Pick workflow.
        "