name: Intelligent Cherry Pick With AI Analysis


on:
  pull_request:
    types:
      - closed
    branches:
      - main


permissions:
  contents: write


jobs:

  cherry-pick-release:

    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}


    steps:


    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0



    - name: Configure variables
      run: |

        echo "MERGE_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> $GITHUB_ENV

        echo "RELEASE_BRANCH=release/v1.0" >> $GITHUB_ENV

        echo "FEATURE_BRANCH=feature/release-v1.0" >> $GITHUB_ENV



    - name: Fetch branches
      run: |

        git fetch origin --prune



    - name: Check release branch
      shell: bash
      run: |

        echo "Checking:"
        echo "$RELEASE_BRANCH"


        if git ls-remote --heads origin "$RELEASE_BRANCH" | grep "$RELEASE_BRANCH"
        then
            echo "Release branch exists"
        else
            echo "Release branch missing"
            exit 1
        fi




    - name: Create or checkout feature branch
      shell: bash
      run: |


        echo "Checking feature branch"


        if git ls-remote --heads origin "$FEATURE_BRANCH" | grep "$FEATURE_BRANCH"
        then

            echo "Feature branch exists"

            git checkout "$FEATURE_BRANCH"

            git pull origin "$FEATURE_BRANCH"


        else

            echo "Creating feature branch"

            git checkout -b "$FEATURE_BRANCH" "origin/$RELEASE_BRANCH"

        fi



        git branch



    - name: Configure git user
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"




    - name: Extract changed files from merge commit
      shell: bash
      run: |


        echo "Merge commit:"
        echo "$MERGE_SHA"



        FILES=$(git diff-tree \
        --no-commit-id \
        --name-only \
        -r \
        -m \
        "$MERGE_SHA")



        echo "$FILES"



        echo "$FILES" > changed_files.txt




    - name: Prepare AI analysis
      shell: bash
      run: |


        echo "Preparing AI input"



        git diff \
        origin/$RELEASE_BRANCH \
        $MERGE_SHA \
        -- \
        ':!.github/*' \
        > ai_analysis.patch



        echo "===== Changed Files ====="

        cat changed_files.txt


        echo "===== Diff ====="

        cat ai_analysis.patch




    - name: Gemini AI Analysis
      shell: bash
      run: |


        python3 <<EOF

        import os
        import json
        import requests


        with open("changed_files.txt") as f:
            files=f.read()


        with open("ai_analysis.patch") as f:
            diff=f.read()



        prompt=f"""

        You are a senior software engineer reviewing a release sync.


        Source:
        main


        Target:
        release/v1.0


        Changed files:

        {files}


        Git diff:

        {diff}



        Analyze:

        1. Changed files
        2. Functions/classes modified
        3. Compatibility issues
        4. Conflict possibilities
        5. Safe to apply or not


        Return JSON only:


        {{
          "safe_to_apply": true,
          "conflicts": false,
          "changed_files": [],
          "summary": "",
          "warnings": []
        }}

        """



        response=requests.post(

          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",

          params={
            "key":os.environ["GEMINI_API_KEY"]
          },

          headers={
            "Content-Type":"application/json"
          },

          json={

            "contents":[
              {
                "parts":[
                  {
                    "text":prompt
                  }
                ]
              }
            ]

          }

        )



        print("====================")

        print(response.text)

        print("====================")


        EOF




    - name: Apply merge commit changes excluding github files
      shell: bash
      run: |


        FILES=$(cat changed_files.txt)



        for FILE in $FILES

        do

          if [[ "$FILE" == .github/* ]]

          then

             echo "Ignoring:"
             echo "$FILE"


          else

             echo "Applying:"
             echo "$FILE"

             git checkout "$MERGE_SHA" -- "$FILE"

          fi


        done




    - name: Remove temporary files
      run: |

        rm -f ai_analysis.patch

        rm -f changed_files.txt




    - name: Commit changes
      run: |


        git add -u


        git commit \
        -m "Sync changes from main merge $MERGE_SHA" \
        || echo "No changes"



    - name: Push feature branch
      run: |


        git push origin "$FEATURE_BRANCH"